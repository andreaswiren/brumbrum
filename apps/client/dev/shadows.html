<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Tree shadow stability review</title>
    <style>
      body {
        margin: 0;
        font: 15px system-ui;
      }
      canvas {
        width: 100vw;
        height: 100vh;
        display: block;
      }
      aside {
        position: absolute;
        top: 16px;
        left: 16px;
        padding: 16px;
        background: #eef0e9ed;
      }
      label {
        display: block;
        margin: 10px 0;
      }
    </style>
  </head>
  <body>
    <canvas id="view"></canvas>
    <aside>
      <strong>Tree shadow stability</strong
      ><label><input id="stable" type="checkbox" checked />Stable shadow projection</label
      ><label><input id="zoom" type="checkbox" checked />Simulate speed zoom</label>
      <p id="metrics">Loading trees…</p>
    </aside>
    <script type="module">
      import {
        Engine,
        WebGPUEngine,
        Scene,
        FreeCamera,
        Vector3,
        Matrix,
        Quaternion,
        MeshBuilder,
        StandardMaterial,
        Color3,
        HemisphericLight,
        DirectionalLight,
      } from '@babylonjs/core';
      import { ForestAssets } from '/src/world/ForestAssets.ts';
      import { createGroundShadows, updateGroundShadows } from '/src/world/GroundLighting.ts';
      let engine;
      const canvas = document.querySelector('#view');
      if (!location.search.includes('webgl2') && (await WebGPUEngine.IsSupportedAsync)) {
        engine = new WebGPUEngine(canvas);
        await engine.initAsync();
      } else engine = new Engine(canvas, true);
      const scene = new Scene(engine),
        camera = new FreeCamera('review', new Vector3(0, 7, -12), scene);
      camera.minZ = 0.1;
      camera.maxZ = 1900;
      camera.setTarget(new Vector3(0, 0, 13));
      new HemisphericLight('fill', Vector3.Up(), scene).intensity = 0.5;
      const sun = new DirectionalLight('sun', new Vector3(-0.55, -0.8, 0.45), scene);
      sun.intensity = 1.4;
      const ground = MeshBuilder.CreateGround('ground', { width: 140, height: 140 }, scene),
        material = new StandardMaterial('earth', scene);
      material.diffuseColor = new Color3(0.48, 0.52, 0.33);
      material.specularColor = Color3.Black();
      ground.material = material;
      ground.receiveShadows = true;
      const forest = await ForestAssets.load(scene),
        matrices = [];
      for (const [x, z, s] of [
        [-8, 12, 1.5],
        [8, 20, 2],
        [15, 3, 1.3],
        [-18, 25, 2.5],
      ])
        Matrix.Compose(
          new Vector3(s, s, s),
          Quaternion.Identity(),
          new Vector3(x, 0, z),
        ).copyToArray(matrices, matrices.length);
      const trees = forest.trees(matrices, true, 'stability review');
      let shadows,
        minimum = Infinity,
        maximum = 0,
        elapsed = 0;
      function rebuild() {
        shadows?.dispose();
        shadows = createGroundShadows(scene, sun, 'high');
        trees.forEach((tree) => shadows.addShadowCaster(tree));
        minimum = Infinity;
        maximum = 0;
      }
      document.querySelector('#stable').onchange = rebuild;
      rebuild();
      scene.onBeforeRenderObservable.add(() => {
        elapsed += engine.getDeltaTime() / 1000;
        camera.fov = document.querySelector('#zoom').checked
          ? 1.12 + Math.sin(elapsed * 1.8) * 0.17
          : 1.12;
        if (document.querySelector('#stable').checked) updateGroundShadows(shadows, camera);
      });
      scene.onAfterRenderObservable.add(() => {
        const scale = shadows.getCascadeProjectionMatrix(0).m[0];
        minimum = Math.min(minimum, scale);
        maximum = Math.max(maximum, scale);
        document.querySelector('#metrics').textContent =
          `Shadow scale variation: ${(((maximum - minimum) / maximum) * 100).toFixed(3)}% · ${shadows.getShadowMap().renderList.length} tree meshes · registered: ${sun.getShadowGenerator() === shadows}`;
      });
      engine.runRenderLoop(() => scene.render());
      window.addEventListener('resize', () => engine.resize());
    </script>
  </body>
</html>
